[workspace]
members = ["tools/architecture-guard", "crates/veil-warden-common", "crates/veil-warden-ebpf", "crates/veil-warden"]
default-members = ["tools/architecture-guard", "crates/veil-warden-common", "crates/veil-warden"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release.package.veil-warden-ebpf]
debug = 2
codegen-units = 1
strip = false
