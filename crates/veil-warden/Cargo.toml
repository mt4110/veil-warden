[package]
name = "veil-warden"
version = "0.1.0"
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[dependencies]
veil-core = { git = "https://github.com/mt4110/veil-rs.git", rev = "83592f5cfb73059f3eaadefcb98bb38262f2ff78" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
veil-warden-common = { path = "../veil-warden-common" }
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }
aya = "=0.14.0"
signal-hook = "=0.3.18"
tokio = { version = "=1.53.1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
