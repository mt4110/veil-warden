name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Static checks and architecture guards
        run: nix develop "path:$PWD" --command ./scripts/check.sh
      - name: Build reproducible checks
        run: nix flake check "path:$PWD"
      - name: Build M1-M3 BPF object and Linux CLI
        run: ./scripts/build-counter.sh
      - name: Build Nix package and check read-only diagnostics
        run: |
          nix --extra-experimental-features 'nix-command flakes' build .#veil-warden --out-link result-package
          nix develop . --command python3 scripts/verify-package.py ./result-package
          nix develop . --command python3 tests/host/test_diagnose.py ./result-package/bin/veil-warden
